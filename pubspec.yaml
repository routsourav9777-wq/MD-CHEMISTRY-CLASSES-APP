name: chemistry_coaching_app

description: Premium animated Chemistry Coaching Centre app.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_messaging: ^16.5.0

  file_picker: ^10.0.0
  image_picker: ^1.2.0
  url_launcher: ^6.3.2

  syncfusion_flutter_pdfviewer: ^31.1.17

  supabase_flutter: ^2.17.2
  supabase_progress_uploads: ^1.0.0
  http: ^1.5.0

  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/md_classes_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/md_classes_logo.png"